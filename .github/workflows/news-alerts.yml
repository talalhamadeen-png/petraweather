name: Weather News Update
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch weather headlines
        run: node scripts/news-alerts.mjs
      - name: Save data
        if: always()
        run: |
          git config user.name "petra-alerts-bot"
          git config user.email "petra-alerts-bot@users.noreply.github.com"
          git add data/weather-news.json
          git diff --cached --quiet || (git commit -m "update weather news [skip ci]" && git pull --rebase -q && git push)
